<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YourTube">
  <title>YourTube</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="no-access" class="screen hidden">
    <div class="no-access-msg">
      <p>Ask your parent for your YourTube setup link</p>
    </div>
  </div>

  <div id="feed-screen" class="screen hidden">
    <header class="app-header">
      <h1 class="app-title">YourTube</h1>
      <span id="kid-name" class="kid-name"></span>
      <button id="logout-btn" class="logout-btn" type="button" title="Switch user">Exit</button>
    </header>
    <div class="search-bar">
      <input id="search-input" class="search-input" type="search" placeholder="Search videos..." autocomplete="off" />
      <button id="search-clear" class="search-clear hidden" type="button" aria-label="Clear search">&times;</button>
    </div>
    <nav id="channel-tabs" class="channel-tabs" role="tablist" aria-label="Filter by channel"></nav>
    <main id="video-grid" class="video-grid" role="main"></main>
    <div id="loading" class="loading hidden">Loading...</div>
  </div>

  <div id="player-screen" class="screen hidden">
    <div class="player-header">
      <button id="back-btn" class="back-btn" type="button">&#8592; Back</button>
    </div>
    <div id="player-container" class="player-container"></div>
    <div id="player-info" class="player-info"></div>
  </div>

  <script type="module" src="/js/player.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
